<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
    <!-- Notepad Back Page (Stacked Paper Effect) -->
    <rect x="16" y="22" width="38" height="60" rx="4" ry="4" fill="#CFD8DC" stroke="#37474F" stroke-width="3" stroke-linejoin="round" />

    <!-- Notepad Front Page -->
    <rect x="14" y="20" width="38" height="60" rx="4" ry="4" fill="#FFFFFF" stroke="#37474F" stroke-width="3" stroke-linejoin="round" />
        
    <!-- Notepad top rings (Proper loops) -->
    <path d="M 22 23 L 22 15 C 22 11 27 11 27 15 L 27 20" fill="none" stroke="#37474F" stroke-width="3" stroke-linecap="round" />
    <path d="M 31 23 L 31 15 C 31 11 36 11 36 15 L 36 20" fill="none" stroke="#37474F" stroke-width="3" stroke-linecap="round" />
    <path d="M 40 23 L 40 15 C 40 11 45 11 45 15 L 45 20" fill="none" stroke="#37474F" stroke-width="3" stroke-linecap="round" />
        
    <!-- Checkboxes and ticks (3 rows) -->
    <!-- Row 1 (y=32) -->
    <rect x="19" y="32" width="9" height="9" rx="2" ry="2" fill="#FFFFFF" stroke="#37474F" stroke-width="2.5" stroke-linejoin="round" />
    <path d="M 21.5 36.5 L 23.5 38.5 L 26.5 34.5" fill="none" stroke="#00897B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 33 36.5 L 45 36.5" fill="none" stroke="#B0BEC5" stroke-width="3" stroke-linecap="round" />

    <!-- Row 2 (y=47) -->
    <rect x="19" y="47" width="9" height="9" rx="2" ry="2" fill="#FFFFFF" stroke="#37474F" stroke-width="2.5" stroke-linejoin="round" />
    <path d="M 21.5 51.5 L 23.5 53.5 L 26.5 49.5" fill="none" stroke="#00897B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 33 51.5 L 45 51.5" fill="none" stroke="#B0BEC5" stroke-width="3" stroke-linecap="round" />

    <!-- Row 3 (y=62) -->
    <rect x="19" y="62" width="9" height="9" rx="2" ry="2" fill="#FFFFFF" stroke="#37474F" stroke-width="2.5" stroke-linejoin="round" />
    <path d="M 21.5 66.5 L 23.5 68.5 L 26.5 64.5" fill="none" stroke="#00897B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 33 66.5 L 45 66.5" fill="none" stroke="#B0BEC5" stroke-width="3" stroke-linecap="round" />
        
    <!-- Funnel Cone -->
    <path d="M 54 44 L 63 61 L 63 73 A 1 1 0 0 0 64 74 L 70 74 A 1 1 0 0 0 71 73 L 71 61 L 80 44 Z" 
          fill="#ECEFF1" 
          stroke="#37474F" 
          stroke-width="3" 
          stroke-linejoin="round" />
          
    <!-- Funnel Metallic Highlight -->
    <path d="M 66 44 L 63 61 L 65 61 L 74 44 Z" fill="#FFFFFF" opacity="0.4" />
        
    <!-- Funnel Top Rim -->
    <rect x="50" y="38" width="34" height="6" rx="3" ry="3" fill="#80CBC4" stroke="#37474F" stroke-width="3" stroke-linejoin="round" />

    <!-- Carrot (falling in) -->
    <!-- Carrot Body -->
    <path d="M 56 33 C 54 28 58 16 63 16 C 65 16 67 18 67 20 C 65 26 60 33 56 33 Z" 
          fill="#FF9800" 
          stroke="#37474F" 
          stroke-width="2.5" 
          stroke-linejoin="round" />
    <!-- Carrot Texture Lines -->
    <path d="M 58 26 L 61 27 M 60 22 L 63 23 M 62 18 L 64 19" fill="none" stroke="#E65100" stroke-width="1.5" stroke-linecap="round" />
    <!-- Carrot Leaves -->
    <path d="M 63 16 L 66 9 M 63 16 L 70 12" fill="none" stroke="#4CAF50" stroke-width="2.5" stroke-linecap="round" />
        
    <!-- Egg (falling in) -->
    <!-- White Egg Shell -->
    <path d="M 76 16 C 81 16 85 22 85 28 C 85 34 81 36 76 36 C 71 36 67 31 67 25 C 67 19 71 16 76 16 Z" 
          fill="#FFFFFF" 
          stroke="#37474F" 
          stroke-width="2.5" />
    <!-- Egg Shadow/Highlight inside Shell -->
    <path d="M 70 21 C 71 19 74 18 76 18" fill="none" stroke="#ECEFF1" stroke-width="1.5" stroke-linecap="round" />
    <!-- Egg Yolk -->
    <circle cx="75" cy="26" r="3.5" fill="#FFB300" />
</svg>
